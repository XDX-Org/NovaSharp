name: Workbench verification

on:
  push:
    branches: [main, monaco, phase-3, phase-4, phase-5, phase-6, phase-7, phase-8, phase-9, phase-10, phase-11, phase-12-14, phase-15, phase15-2, phase-17]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-14
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install Linux native host dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-1 libwebkitgtk-6.0-4 xvfb
      - name: Acquire pinned language servers
        shell: bash
        run: tools/acquire-language-servers.sh ${{ matrix.rid }}
      - name: Build pinned Monaco assets
        shell: bash
        env:
          NOVASHARP_RELEASE_RID: ${{ matrix.rid }}
        run: tools/build-monaco-assets.sh
      - name: Acquire pinned debug adapter
        shell: bash
        run: tools/acquire-debug-adapter.sh ${{ matrix.rid }}
      - run: dotnet restore NovaSharp.slnx -r ${{ matrix.rid }} -p:Configuration=Release
      - run: dotnet build NovaSharp.slnx --no-restore --configuration Release --warnaserror
      - name: Verify release excludes legacy language providers
        shell: pwsh
        run: |
          $dependencies = Get-Content 'src/NovaSharp/bin/Release/net10.0/NovaSharp.deps.json' -Raw
          if ($dependencies -match 'Microsoft.CodeAnalysis.(CSharp.)?Features') { throw 'Release contains legacy Roslyn Features dependencies.' }
      - name: Run unit and acceptance tests
        shell: pwsh
        run: dotnet tests/NovaSharp.Tests/bin/Release/net10.0/NovaSharp.Tests.dll --progress off
      - run: dotnet publish src/NovaSharp/NovaSharp.csproj --no-restore --configuration Release --runtime ${{ matrix.rid }} --self-contained false --output artifacts/app
      - name: Run packaged Linux native-host smoke
        if: runner.os == 'Linux'
        shell: pwsh
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: 1
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: 1
          WEBKIT_DISABLE_DMABUF_RENDERER: 1
        run: |
          $fixture = Join-Path $PWD 'phase2-smoke.cs'
          $report = Join-Path $PWD 'phase2-smoke.json'
          (1..500 | ForEach-Object { "public sealed class Fixture$_ { public string Value => `"line $_`"; }" }) | Set-Content -Encoding utf8 $fixture
          $binary = if ($IsWindows) { 'artifacts/app/NovaSharp.exe' } else { 'artifacts/app/NovaSharp' }
          $arguments = @("--phase2-smoke=$fixture", "--smoke-report=$report")
          $process = Start-Process xvfb-run -ArgumentList (@('-a', $binary) + $arguments) -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill($true); throw 'Native smoke timed out.' }
          if ($process.ExitCode -ne 0 -and -not (Test-Path $report)) { throw "Native smoke exited with $($process.ExitCode) before reporting." }
          $result = Get-Content $report | ConvertFrom-Json
          $required = 'InputPresent', 'SelectionReplacement', 'BracketPairing', 'TabInsertion', 'CompositionCommittedOnce', 'RowsBounded', 'DocumentLoaded', 'DocumentClean'
          foreach ($name in $required) { if (-not $result.$name) { throw "Smoke assertion failed: $name" } }
      - name: Run packaged Linux Monaco smoke
        if: runner.os == 'Linux'
        shell: pwsh
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: 1
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: 1
          WEBKIT_DISABLE_DMABUF_RENDERER: 1
        run: |
          $fixture = Join-Path $PWD 'phase2-smoke.cs'
          $report = Join-Path $PWD 'monaco-smoke.json'
          $binary = if ($IsWindows) { 'artifacts/app/NovaSharp.exe' } else { 'artifacts/app/NovaSharp' }
          $arguments = @('--monaco-editor', "--phase2-smoke=$fixture", "--smoke-report=$report")
          $process = Start-Process xvfb-run -ArgumentList (@('-a', $binary) + $arguments) -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill($true); throw 'Monaco smoke timed out.' }
          if ($process.ExitCode -ne 0 -and -not (Test-Path $report)) { throw "Monaco smoke exited with $($process.ExitCode) before reporting." }
          $result = Get-Content $report | ConvertFrom-Json
          $required = 'InputPresent', 'SelectionReplacement', 'BracketPairing', 'TabInsertion', 'CompositionCommittedOnce', 'RowsBounded', 'DocumentLoaded', 'DocumentClean'
          foreach ($name in $required) { if (-not $result.$name) { throw "Monaco smoke assertion failed: $name" } }
      - name: Run packaged Phase 3 native-host smoke
        if: false # Obsolete textarea-DOM smoke; Monaco coverage runs above.
        shell: pwsh
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: 1
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: 1
          WEBKIT_DISABLE_DMABUF_RENDERER: 1
        run: |
          $workspace = Join-Path $PWD 'phase3-workspace'
          $report = Join-Path $PWD 'phase3-smoke.json'
          New-Item -ItemType Directory -Path $workspace | Out-Null
          'class Active;' | Set-Content -Encoding utf8 (Join-Path $workspace 'active.cs')
          1..500 | ForEach-Object { New-Item -ItemType File -Path (Join-Path $workspace "fixture-$_.cs") | Out-Null }
          $binary = if ($IsWindows) { 'artifacts/app/NovaSharp.exe' } else { 'artifacts/app/NovaSharp' }
          $arguments = @("--phase3-smoke=$workspace", "--smoke-report=$report")
          $process = if ($IsLinux) { Start-Process xvfb-run -ArgumentList (@('-a', $binary) + $arguments) -PassThru }
            else { Start-Process $binary -ArgumentList $arguments -PassThru }
          if (-not $process.WaitForExit(60000)) { $process.Kill($true); throw 'Phase 3 native smoke timed out.' }
          if ($process.ExitCode -ne 0 -and -not (Test-Path $report)) { throw "Phase 3 native smoke exited with $($process.ExitCode) before reporting." }
          $result = Get-Content $report | ConvertFrom-Json
          $required = 'TreePresent', 'RowsBounded', 'KeyboardNavigation', 'ContextActionsRelevant', 'ContextMenuInsideViewport', 'ContextMenuDismissed', 'NativeContextBypass', 'RenamePreservedDirtySelection'
          foreach ($name in $required) { if (-not $result.$name) { throw "Phase 3 smoke assertion failed: $name" } }
      - name: Run packaged Linux Phase 4 native-host smoke
        if: runner.os == 'Linux'
        shell: pwsh
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: 1
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: 1
          WEBKIT_DISABLE_DMABUF_RENDERER: 1
        run: |
          $workspace = Join-Path $PWD 'phase4-workspace'
          $report = Join-Path $PWD 'phase4-smoke.json'
          New-Item -ItemType Directory -Path $workspace | Out-Null
          1..30 | ForEach-Object { "class Phase4Fixture$_;" | Set-Content -Encoding utf8 (Join-Path $workspace "fixture-$_.cs") }
          $binary = 'artifacts/app/NovaSharp'
          $arguments = @("--phase4-smoke=$workspace", "--smoke-report=$report")
          $required = 'TabsPresent', 'PointerReordered', 'OverflowScrollable', 'MiddleClickClosed', 'AccessibleLabels', 'ContextCommandsPresent'
          $passed = $false
          foreach ($attempt in 1..2) {
            Remove-Item $report -ErrorAction SilentlyContinue
            $attemptState = Join-Path $workspace "state-$attempt"
            New-Item -ItemType Directory -Path $attemptState -Force | Out-Null
            $env:XDG_DATA_HOME = Join-Path $attemptState 'data'
            $env:XDG_CONFIG_HOME = Join-Path $attemptState 'config'
            $env:XDG_CACHE_HOME = Join-Path $attemptState 'cache'
            $process = Start-Process xvfb-run -ArgumentList (@('-a', $binary) + $arguments) -PassThru
            if (-not $process.WaitForExit(120000)) { $process.Kill($true); continue }
            if (-not (Test-Path $report)) { continue }
            $result = Get-Content $report | ConvertFrom-Json
            $failed = @($required | Where-Object { -not $result.$_ })
            if ($failed.Count -eq 0) { $passed = $true; break }
          }
          if (-not $passed) { throw "Phase 4 native smoke failed after two attempts: $($failed -join ', ') ($($result.Error))" }
      - name: Run packaged Linux Phase 5 native-host smoke
        if: false # Obsolete textarea-DOM smoke; shared-model behavior is covered by tests.
        shell: pwsh
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: 1
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: 1
          WEBKIT_DISABLE_DMABUF_RENDERER: 1
        run: |
          $workspace = Join-Path $PWD 'phase5-workspace'
          $report = Join-Path $PWD 'phase5-smoke.json'
          New-Item -ItemType Directory -Path $workspace | Out-Null
          'class Shared;' | Set-Content -Encoding utf8 (Join-Path $workspace 'shared.cs')
          $binary = 'artifacts/app/NovaSharp'
          $arguments = @("--phase5-smoke=$workspace", "--smoke-report=$report")
          $process = Start-Process xvfb-run -ArgumentList (@('-a', $binary) + $arguments) -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill($true); throw 'Phase 5 native smoke timed out.' }
          if ($process.ExitCode -ne 0 -and -not (Test-Path $report)) { throw "Phase 5 native smoke exited with $($process.ExitCode) before reporting." }
          $result = Get-Content $report | ConvertFrom-Json
          $required = 'GroupsPresent', 'SharedEditsImmediate', 'IndependentSelections', 'SplitterAccessible', 'SplitterResized', 'DropZonesPresent', 'EdgeDropSplit', 'NarrowLayoutOperable', 'EscapeCancelsDrag', 'FractionalPointerResize', 'DirectionalFocus'
          foreach ($name in $required) { if (-not $result.$name) { throw "Phase 5 smoke assertion failed: $name" } }
      - name: Run packaged Linux Phase 6 native-host smoke
        if: runner.os == 'Linux'
        shell: pwsh
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: 1
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: 1
          WEBKIT_DISABLE_DMABUF_RENDERER: 1
        run: |
          $workspace = Join-Path $PWD 'phase6-workspace'
          $report = Join-Path $PWD 'phase6-smoke.json'
          New-Item -ItemType Directory -Path (Join-Path $workspace 'One') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $workspace 'Two') -Force | Out-Null
          'public class Shared;' | Set-Content -Encoding utf8 (Join-Path $workspace 'Shared.cs')
          $project = '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup><ItemGroup><Compile Include="../Shared.cs" Link="Shared.cs" /></ItemGroup></Project>'
          $project | Set-Content -Encoding utf8 (Join-Path $workspace 'One/One.csproj')
          $project | Set-Content -Encoding utf8 (Join-Path $workspace 'Two/Two.csproj')
          '<Solution><Project Path="One/One.csproj" /><Project Path="Two/Two.csproj" /></Solution>' | Set-Content -Encoding utf8 (Join-Path $workspace 'Fixture.slnx')
          $binary = 'artifacts/app/NovaSharp'
          $arguments = @("--phase6-smoke=$(Join-Path $workspace 'Fixture.slnx')", "--smoke-report=$report")
          $required = 'SolutionTreePresent', 'LoadCompleted', 'SemanticDocumentsMapped', 'LinkedContextsPresent', 'EvaluatedTargetContexts', 'ProjectFileEditable', 'ContextMenuPresent', 'DragSourcePresent'
          $passed = $false
          foreach ($attempt in 1..2) {
            Remove-Item $report -ErrorAction SilentlyContinue
            $attemptState = Join-Path $workspace "state-$attempt"
            New-Item -ItemType Directory -Path $attemptState -Force | Out-Null
            $env:XDG_DATA_HOME = Join-Path $attemptState 'data'
            $env:XDG_CONFIG_HOME = Join-Path $attemptState 'config'
            $env:XDG_CACHE_HOME = Join-Path $attemptState 'cache'
            $process = Start-Process xvfb-run -ArgumentList (@('-a', $binary) + $arguments) -PassThru
            if (-not $process.WaitForExit(60000)) { $process.Kill($true); continue }
            if (-not (Test-Path $report)) { continue }
            $result = Get-Content $report | ConvertFrom-Json
            $failed = @($required | Where-Object { -not $result.$_ })
            if ($failed.Count -eq 0 -and $result.ProjectNodes -ge 3) { $passed = $true; break }
          }
          if (-not $passed) { throw "Phase 6 native smoke failed after two attempts: $($failed -join ', ')" }
      - name: Run packaged Phase 7 native-host smoke
        if: false # Obsolete textarea-DOM language smoke.
        shell: pwsh
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: 1
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: 1
          WEBKIT_DISABLE_DMABUF_RENDERER: 1
        run: |
          $workspace = Join-Path $PWD 'phase7-workspace'
          $report = Join-Path $PWD 'phase7-smoke.json'
          New-Item -ItemType Directory -Path $workspace | Out-Null
          '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup></Project>' | Set-Content -Encoding utf8 (Join-Path $workspace 'Fixture.csproj')
          'using System; class C { void M() { Console.WriteLine(); } }' | Set-Content -Encoding utf8 (Join-Path $workspace 'Program.cs')
          '<Solution><Project Path="Fixture.csproj" /></Solution>' | Set-Content -Encoding utf8 (Join-Path $workspace 'Fixture.slnx')
          dotnet restore (Join-Path $workspace 'Fixture.csproj')
          $binary = if ($IsWindows) { 'artifacts/app/NovaSharp.exe' } else { 'artifacts/app/NovaSharp' }
          $arguments = @("--phase7-smoke=$(Join-Path $workspace 'Fixture.slnx')", "--smoke-report=$report")
          $process = if ($IsLinux) { Start-Process xvfb-run -ArgumentList (@('-a', $binary) + $arguments) -PassThru }
            else { Start-Process $binary -ArgumentList $arguments -PassThru }
          if (-not $process.WaitForExit(120000)) { $process.Kill($true); throw 'Phase 7 native smoke timed out.' }
          if ($process.ExitCode -ne 0 -and -not (Test-Path $report)) { throw "Phase 7 native smoke exited with $($process.ExitCode) before reporting." }
          $result = Get-Content $report | ConvertFrom-Json
          $required = 'CompletionVisible', 'CompletionKeyboardOwned', 'SignatureVisible', 'HoverVisible', 'SemanticTokensPresent', 'AutoIndent', 'CommentToggle', 'FormattingApplied', 'LoadingStateCleared'
          foreach ($name in $required) { if (-not $result.$name) { throw "Phase 7 smoke assertion failed: $name ($($result.Error))" } }
      - name: Run packaged Phase 8 native-host smoke
        if: false # Obsolete textarea-DOM language smoke.
        shell: pwsh
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: 1
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: 1
          WEBKIT_DISABLE_DMABUF_RENDERER: 1
        run: |
          $workspace = Join-Path $PWD 'phase8-workspace'
          $report = Join-Path $PWD 'phase8-smoke.json'
          New-Item -ItemType Directory -Path $workspace | Out-Null
          '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup></Project>' | Set-Content -Encoding utf8 (Join-Path $workspace 'Fixture.csproj')
          'class C { C value; }' | Set-Content -Encoding utf8 (Join-Path $workspace 'Program.cs')
          '<Solution><Project Path="Fixture.csproj" /></Solution>' | Set-Content -Encoding utf8 (Join-Path $workspace 'Fixture.slnx')
          dotnet restore (Join-Path $workspace 'Fixture.csproj')
          $binary = if ($IsWindows) { 'artifacts/app/NovaSharp.exe' } else { 'artifacts/app/NovaSharp' }
          $arguments = @("--phase8-smoke=$(Join-Path $workspace 'Fixture.slnx')", "--smoke-report=$report")
          $process = if ($IsLinux) { Start-Process xvfb-run -ArgumentList (@('-a', $binary) + $arguments) -PassThru }
            else { Start-Process $binary -ArgumentList $arguments -PassThru }
          if (-not $process.WaitForExit(120000)) { $process.Kill($true); throw 'Phase 8 native smoke timed out.' }
          if ($process.ExitCode -ne 0 -and -not (Test-Path $report)) { throw "Phase 8 native smoke exited with $($process.ExitCode) before reporting." }
          $result = Get-Content $report | ConvertFrom-Json
          $required = 'DiagnosticSquiggle', 'ProblemsPanel', 'DefinitionPeek', 'Outline', 'CodeActions'
          foreach ($name in $required) { if (-not $result.$name) { throw "Phase 8 smoke assertion failed: $name ($($result.Error))" } }
      - name: Run packaged Linux Phase 9 native-host smoke
        if: runner.os == 'Linux'
        shell: pwsh
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: 1
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: 1
          WEBKIT_DISABLE_DMABUF_RENDERER: 1
        run: |
          $workspace = Join-Path $PWD 'phase9-workspace'
          $report = Join-Path $PWD 'phase9-smoke.json'
          New-Item -ItemType Directory -Path (Join-Path $workspace 'One') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $workspace 'Two') -Force | Out-Null
          '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup></Project>' | Set-Content -Encoding utf8 (Join-Path $workspace 'Fixture.csproj')
          'class Program { string Value = "needle"; }' | Set-Content -Encoding utf8 (Join-Path $workspace 'Program.cs')
          'class Shared { string Value = "needle"; }' | Set-Content -Encoding utf8 (Join-Path $workspace 'One/Shared.cs')
          'class Shared { string Value = "needle"; }' | Set-Content -Encoding utf8 (Join-Path $workspace 'Two/Shared.cs')
          '<Solution><Project Path="Fixture.csproj" /></Solution>' | Set-Content -Encoding utf8 (Join-Path $workspace 'Fixture.slnx')
          dotnet restore (Join-Path $workspace 'Fixture.csproj')
          $binary = 'artifacts/app/NovaSharp'
          $arguments = @("--phase9-smoke=$(Join-Path $workspace 'Fixture.slnx')", "--smoke-report=$report")
          $required = 'QuickOpenVisible', 'DuplicateFilesVisible', 'SearchVisible', 'ResultsStreamed', 'ReplacePreview'
          $passed = $false
          foreach ($attempt in 1..2) {
            Remove-Item $report -ErrorAction SilentlyContinue
            $attemptState = Join-Path $workspace "state-$attempt"
            New-Item -ItemType Directory -Path $attemptState -Force | Out-Null
            $env:XDG_DATA_HOME = Join-Path $attemptState 'data'
            $env:XDG_CONFIG_HOME = Join-Path $attemptState 'config'
            $env:XDG_CACHE_HOME = Join-Path $attemptState 'cache'
            $process = Start-Process xvfb-run -ArgumentList (@('-a', $binary) + $arguments) -PassThru
            if (-not $process.WaitForExit(60000)) { $process.Kill($true); continue }
            if (-not (Test-Path $report)) { continue }
            $result = Get-Content $report | ConvertFrom-Json
            $failed = @($required | Where-Object { -not $result.$_ })
            if ($failed.Count -eq 0) { $passed = $true; break }
          }
          if (-not $passed) { throw "Phase 9 native smoke failed after two attempts: $($failed -join ', ') ($($result.Error))" }
      - name: Run packaged Linux Phase 11 terminal smoke
        if: runner.os == 'Linux'
        shell: pwsh
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: 1
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: 1
          WEBKIT_DISABLE_DMABUF_RENDERER: 1
        run: |
          $workspace = Join-Path $PWD 'phase11-workspace'
          $report = Join-Path $PWD 'phase11-smoke.json'
          New-Item -ItemType Directory -Path $workspace | Out-Null
          $binary = 'artifacts/app/NovaSharp'
          $arguments = @("--phase11-smoke=$workspace", "--smoke-report=$report")
          $required = 'TerminalPresent', 'InputRoundTrip', 'ResizeValid', 'ProcessExited'
          $passed = $false
          foreach ($attempt in 1..2) {
            Remove-Item $report -ErrorAction SilentlyContinue
            $attemptState = Join-Path $workspace "state-$attempt"
            New-Item -ItemType Directory -Path $attemptState -Force | Out-Null
            $env:XDG_DATA_HOME = Join-Path $attemptState 'data'
            $env:XDG_CONFIG_HOME = Join-Path $attemptState 'config'
            $env:XDG_CACHE_HOME = Join-Path $attemptState 'cache'
            $process = Start-Process xvfb-run -ArgumentList (@('-a', $binary) + $arguments) -PassThru
            if (-not $process.WaitForExit(60000)) { $process.Kill($true); continue }
            if (-not (Test-Path $report)) { continue }
            $result = Get-Content $report | ConvertFrom-Json
            $failed = @($required | Where-Object { -not $result.$_ })
            if ($failed.Count -eq 0) { $passed = $true; break }
          }
          if (-not $passed) { throw "Phase 11 terminal smoke failed after two attempts: $($failed -join ', ') ($($result.Error))" }
      - name: Run packaged Phase 15 web-language smoke
        if: false # Obsolete textarea-DOM language smoke.
        shell: pwsh
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: 1
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: 1
          WEBKIT_DISABLE_DMABUF_RENDERER: 1
        run: |
          $workspace = Join-Path $PWD 'phase15-workspace'
          $report = Join-Path $PWD 'phase15-smoke.json'
          New-Item -ItemType Directory -Path $workspace | Out-Null
          '<Project Sdk="Microsoft.NET.Sdk.Razor"><PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup><ItemGroup><FrameworkReference Include="Microsoft.AspNetCore.App" /></ItemGroup></Project>' | Set-Content -Encoding utf8 (Join-Path $workspace 'Fixture.csproj')
          '<MyCard />' | Set-Content -Encoding utf8 (Join-Path $workspace 'Index.razor')
          '<article>@Title</article>@code { [Parameter] public string Title { get; set; } = ""; }' | Set-Content -Encoding utf8 (Join-Path $workspace 'MyCard.razor')
          dotnet restore (Join-Path $workspace 'Fixture.csproj')
          $binary = if ($IsWindows) { 'artifacts/app/NovaSharp.exe' } else { 'artifacts/app/NovaSharp' }
          $arguments = @("--phase15-smoke=$(Join-Path $workspace 'Fixture.csproj')", "--smoke-report=$report")
          $process = if ($IsLinux) { Start-Process xvfb-run -ArgumentList (@('-a', $binary) + $arguments) -PassThru }
            else { Start-Process $binary -ArgumentList $arguments -PassThru }
          if (-not $process.WaitForExit(120000)) { $process.Kill($true); throw 'Phase 15 native smoke timed out.' }
          if ($process.ExitCode -ne 0 -and -not (Test-Path $report)) { throw "Phase 15 native smoke exited with $($process.ExitCode) before reporting." }
          $result = Get-Content $report | ConvertFrom-Json
          $required = 'LanguageSelected', 'ComponentCompletion', 'SemanticTokens', 'Diagnostics', 'Formatting'
          foreach ($name in $required) { if (-not $result.$name) { throw "Phase 15 smoke assertion failed: $name ($($result.Error))" } }
      - name: Create versioned release archive and checksum
        shell: pwsh
        run: |
          $name = "NovaSharp-0.1.0-preview.1-${{ matrix.rid }}"
          New-Item -ItemType Directory -Force release | Out-Null
          if ($IsWindows) {
            Compress-Archive -Path artifacts/app/* -DestinationPath "release/$name.zip"
            $archive = "release/$name.zip"
          } else {
            tar -C artifacts/app -czf "release/$name.tar.gz" .
            $archive = "release/$name.tar.gz"
          }
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content -Encoding ascii "$archive.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-3-${{ matrix.rid }}
          path: |
            phase2-smoke.json
            monaco-smoke.json
            phase3-smoke.json
            phase4-smoke.json
            phase5-smoke.json
            phase6-smoke.json
            phase7-smoke.json
            phase8-smoke.json
            phase9-smoke.json
            phase11-smoke.json
            phase15-smoke.json
            artifacts/app
            release
