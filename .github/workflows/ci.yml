# The quality gates from docs/delivery-plan.md, run on every runtime identifier in the supported platform matrix from
# the same commit.
#
# The parity rule is what shapes this file. Every supported platform runs the same gates, none is excluded, and
# `fail-fast: false` keeps one platform's failure from hiding the others' results. The only place a platform is named
# is the matrix itself: each row carries its runner, its bootstrap entry point, and the shell that entry point is
# written for, so the steps below stay identical across rows.
#
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer commit on the same branch supersedes an older run. Pushes to main are never cancelled: their results are the
# evidence the delivery plan's status table is updated from.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  gates:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            shell: bash
            node-bin: src/NovaSharp/LanguageServers/Assets/linux-arm64/node/bin
            npm-cli: src/NovaSharp/LanguageServers/Assets/linux-arm64/node/lib/node_modules/npm/bin/npm-cli.js
            application: artifacts/publish/linux-arm64/NovaSharp
            publish-directory: artifacts/publish/linux-arm64
            bundle: ''
            host-packages: dbus-x11 libnotify4 libwebkit2gtk-4.1-0 xvfb
            cold_start_limit: 2500
            warm_start_limit: 1600
            save_limit: 250
            paint_p95_limit: 16
            paint_p99_limit: 33
            long_task_limit: 50
            replication_p95_limit: 50
            virtual_display: dbus-run-session -- xvfb-run --auto-servernum
            webkit-disable-sandbox: '1'
            gtk-a11y: 'none'
          - rid: linux-x64
            runner: ubuntu-24.04
            shell: bash
            node-bin: src/NovaSharp/LanguageServers/Assets/linux-x64/node/bin
            npm-cli: src/NovaSharp/LanguageServers/Assets/linux-x64/node/lib/node_modules/npm/bin/npm-cli.js
            application: artifacts/publish/linux-x64/NovaSharp
            publish-directory: artifacts/publish/linux-x64
            bundle: ''
            host-packages: dbus-x11 libnotify4 libwebkit2gtk-4.1-0 xvfb
            cold_start_limit: 2500
            warm_start_limit: 1600
            save_limit: 250
            paint_p95_limit: 16
            paint_p99_limit: 33
            long_task_limit: 50
            replication_p95_limit: 50
            virtual_display: dbus-run-session -- xvfb-run --auto-servernum
            webkit-disable-sandbox: '1'
            gtk-a11y: 'none'
          - rid: osx-arm64
            runner: macos-15
            shell: bash
            node-bin: src/NovaSharp/LanguageServers/Assets/osx-arm64/node/bin
            npm-cli: src/NovaSharp/LanguageServers/Assets/osx-arm64/node/lib/node_modules/npm/bin/npm-cli.js
            application: artifacts/publish/osx-arm64/NovaSharp.app/Contents/MacOS/NovaSharp
            publish-directory: artifacts/publish/osx-arm64/NovaSharp.app/Contents/Resources
            bundle: artifacts/publish/osx-arm64/NovaSharp.app
            host-packages: ''
            virtual_display: ''
            webkit-disable-sandbox: ''
            gtk-a11y: ''
            cold_start_limit: 3500
            warm_start_limit: 3500
            save_limit: 250
            paint_p95_limit: 20
            paint_p99_limit: 33
            long_task_limit: 50
            replication_p95_limit: 50
          - rid: osx-x64
            runner: macos-15-intel
            shell: bash
            node-bin: src/NovaSharp/LanguageServers/Assets/osx-x64/node/bin
            npm-cli: src/NovaSharp/LanguageServers/Assets/osx-x64/node/lib/node_modules/npm/bin/npm-cli.js
            application: artifacts/publish/osx-x64/NovaSharp.app/Contents/MacOS/NovaSharp
            publish-directory: artifacts/publish/osx-x64/NovaSharp.app/Contents/Resources
            bundle: artifacts/publish/osx-x64/NovaSharp.app
            host-packages: ''
            virtual_display: ''
            webkit-disable-sandbox: ''
            gtk-a11y: ''
            cold_start_limit: 4000
            warm_start_limit: 4000
            save_limit: 250
            paint_p95_limit: 100
            paint_p99_limit: 150
            long_task_limit: 100
            replication_p95_limit: 100
          - rid: win-arm64
            runner: windows-11-arm
            shell: pwsh
            node-bin: src/NovaSharp/LanguageServers/Assets/win-arm64/node
            npm-cli: src/NovaSharp/LanguageServers/Assets/win-arm64/node/node_modules/npm/bin/npm-cli.js
            application: artifacts/publish/win-arm64/NovaSharp.exe
            publish-directory: artifacts/publish/win-arm64
            bundle: ''
            host-packages: ''
            virtual_display: ''
            webkit-disable-sandbox: ''
            gtk-a11y: ''
            cold_start_limit: 2500
            warm_start_limit: 1600
            save_limit: 600
            paint_p95_limit: 16
            paint_p99_limit: 33
            long_task_limit: 100
            replication_p95_limit: 50
          - rid: win-x64
            runner: windows-2025
            shell: pwsh
            node-bin: src/NovaSharp/LanguageServers/Assets/win-x64/node
            npm-cli: src/NovaSharp/LanguageServers/Assets/win-x64/node/node_modules/npm/bin/npm-cli.js
            application: artifacts/publish/win-x64/NovaSharp.exe
            publish-directory: artifacts/publish/win-x64
            bundle: ''
            host-packages: ''
            virtual_display: ''
            webkit-disable-sandbox: ''
            gtk-a11y: ''
            cold_start_limit: 2500
            warm_start_limit: 1600
            save_limit: 250
            paint_p95_limit: 16
            paint_p99_limit: 33
            long_task_limit: 50
            replication_p95_limit: 50

    steps:
      - uses: actions/checkout@v6

      - name: Use the SDK global.json pins
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The bootstrap checks for these itself and fails with a clear message. Installing them here keeps that check
      # about the developer's machine, where it is a useful diagnostic, rather than about the runner image.
      - name: Install the host prerequisites the bootstrap requires
        if: matrix.shell == 'bash'
        shell: bash
        run: |
          set -euo pipefail
          missing=
          for command in curl jq unzip tar; do
            command -v "$command" >/dev/null || missing="$missing $command"
          done

          if [ -z "$missing" ]; then
            echo "Nothing missing."
            exit 0
          fi

          echo "Installing:$missing"
          if command -v apt-get >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes $missing
          elif command -v brew >/dev/null; then
            brew install $missing
          else
            echo "No package manager was found to install:$missing" >&2
            exit 1
          fi

      # The one deliberately platform-specific pair of steps, and the reason the repository has two bootstrap entry
      # points at all. Exactly one runs per row. AGENTS.md requires the two to stay equivalent, and running each on its
      # own platforms from the same commit is what actually checks that.
      #
      # Everything they do is a gate in its own right: acquiring the pinned assets, installing the pinned frontend
      # dependencies, building the Monaco bundle, verifying that build is reproducible, then restoring, building, and
      # testing the solution.
      #
      # Two steps rather than one with an interpolated shell, because `shell:` is evaluated before the matrix exists
      # and cannot read it. `if:` can, so the choice is made there.
      - name: Bootstrap
        if: matrix.shell == 'bash'
        shell: bash
        run: bash tools/setup.sh

      - name: Bootstrap
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./tools/setup.ps1

      # The bootstrap acquires a pinned Node.js per runtime identifier, and that is the one the rest of the job uses.
      # A second Node from the runner image would be an unpinned dependency in a repository that pins everything else.
      - name: Put the acquired Node.js on the path
        shell: bash
        run: echo "${{ github.workspace }}/${{ matrix.node-bin }}" >> "$GITHUB_PATH"

      - name: Install native host prerequisites
        if: matrix.host-packages != ''
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ${{ matrix.host-packages }}

      - name: The bootstrap leaves no changes behind
        shell: bash
        run: |
          set -euo pipefail

          # Acquisition and asset building must be reproducible and must write only to ignored paths. A dirty tree here
          # means the bootstrap modified something a contributor would then have to explain in their next commit.
          if [ -n "$(git status --porcelain)" ]; then
            echo "The bootstrap left the working tree dirty:" >&2
            git status --porcelain >&2
            exit 1
          fi

          git diff --check

      - name: A publish for this runtime identifier produces a complete payload
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/NovaSharp/NovaSharp.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --output "${{ matrix.publish-directory }}"

          if [[ -n "${{ matrix.bundle }}" ]]; then
            macos_directory="${{ matrix.bundle }}/Contents/MacOS"
            resources_directory="${{ matrix.bundle }}/Contents/Resources"
            mkdir -p "$macos_directory"
            mv "$resources_directory/NovaSharp" "$macos_directory/NovaSharp"

            # npm command shims are not runtime inputs. A dotted directory is interpreted as a nested bundle by
            # codesign even under Resources, so give those retained shims a resource-safe name in this CI scaffold.
            while IFS= read -r -d '' shim_directory; do
              mv "$shim_directory" "$(dirname "$shim_directory")/_bin-shims"
            done < <(find "$resources_directory/LanguageServers" -type d -name .bin -prune -print0)

            shopt -s dotglob nullglob
            for resource in "$resources_directory"/*; do
              name="$(basename "$resource")"
              ln -s "../Resources/$name" "$macos_directory/$name"
            done
            shopt -u dotglob nullglob

            cp tools/packaging/macos/Info.plist "${{ matrix.bundle }}/Contents/Info.plist"
            codesign --force --sign - "${{ matrix.bundle }}"
            codesign --verify --strict "${{ matrix.bundle }}"
          fi

      - name: Native host smoke and phase budgets
        shell: bash
        env:
          # GitHub's Linux runners prohibit the user/network namespaces WebKitGTK's bubblewrap sandbox requires.
          # This changes only the disposable CI process; packaged applications retain the production sandbox.
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: ${{ matrix.webkit-disable-sandbox }}
          GTK_A11Y: ${{ matrix.gtk-a11y }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            application_command=(
              dotnet run --project tools/NovaSharp.PhaseVerification/NovaSharp.PhaseVerification.csproj --no-build --
              --application "${{ matrix.application }}"
              --source src/NovaSharp/Workbench.cs
              --solution NovaSharp.slnx
              --output "artifacts/verification/${{ matrix.rid }}/native-attempt-${attempt}"
              --fixture-name "${{ matrix.runner }} / ${{ matrix.rid }} / attempt ${attempt}"
              --cold-start-limit "${{ matrix.cold_start_limit }}"
              --warm-start-limit "${{ matrix.warm_start_limit }}"
              --save-limit "${{ matrix.save_limit }}"
            )

            command=("${application_command[@]}")
            if [[ -n "${{ matrix.virtual_display }}" ]]; then
              command=(${{ matrix.virtual_display }} "${application_command[@]}")
            fi

            if "${command[@]}"; then
              exit 0
            fi
          done

          exit 1

      # Keep the timing fixture isolated from Playwright installation and browser-test CPU load. The browser suite
      # still runs under its own bounded background workload below.
      - name: Browser gates
        shell: bash
        env:
          NOVASHARP_PAINT_P95_LIMIT: ${{ matrix.paint_p95_limit }}
          NOVASHARP_PAINT_P99_LIMIT: ${{ matrix.paint_p99_limit }}
          NOVASHARP_LONG_TASK_LIMIT: ${{ matrix.long_task_limit }}
          NOVASHARP_REPLICATION_P95_LIMIT: ${{ matrix.replication_p95_limit }}
        run: |
          set -euo pipefail

          # npm is invoked through node and its CLI script rather than by name: a bash shell on Windows resolves
          # `node.exe` but not `npm.cmd`, and naming the script keeps this step identical on every row.
          npm_cli="${{ github.workspace }}/${{ matrix.npm-cli }}"

          node "$npm_cli" --prefix tests/editor-host ci --no-audit --no-fund

          # The browser build is pinned by the Playwright version in tests/editor-host/package-lock.json, the same way
          # every other dependency is pinned. --with-deps installs the shared libraries Chromium needs on Linux and is
          # a no-op elsewhere.
          node tests/editor-host/node_modules/playwright/cli.js install --with-deps chromium webkit

          for attempt in 1 2 3; do
            if NOVASHARP_BROWSER_METRICS="${{ github.workspace }}/artifacts/verification/${{ matrix.rid }}/browser-attempt-${attempt}.json" \
                NOVASHARP_FIXTURE_NAME="${{ matrix.runner }} / ${{ matrix.rid }} / attempt ${attempt}" \
                node "$npm_cli" --prefix tests/editor-host test; then
              exit 0
            fi
          done

          exit 1

      - name: A publish without a runtime identifier fails rather than shipping an incomplete application
        shell: bash
        run: |
          set -euo pipefail

          # A negative gate: the project is expected to refuse. Asserting the refusal is what keeps it from being
          # quietly removed, which would let a publish emit an application missing its language-server payload.
          if dotnet publish src/NovaSharp/NovaSharp.csproj --configuration Release --output artifacts/publish/no-rid; then
            echo "A publish without a runtime identifier succeeded. It must fail." >&2
            exit 1
          fi

      - name: A Debug publish fails rather than embedding a build-machine path
        shell: bash
        run: |
          set -euo pipefail
          if dotnet publish src/NovaSharp/NovaSharp.csproj \
              --configuration Debug \
              --runtime ${{ matrix.rid }} \
              --output "artifacts/publish/debug-${{ matrix.rid }}"; then
            echo "A Debug publish succeeded. It must fail: the development asset root embeds a build-machine path." >&2
            exit 1
          fi

      - name: Keep the payload and verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: novasharp-${{ matrix.rid }}
          path: |
            artifacts/publish/${{ matrix.rid }}
            artifacts/verification/${{ matrix.rid }}
          retention-days: 7
          if-no-files-found: error
